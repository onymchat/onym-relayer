name: Release

# Publishes the client discovery manifests as `latest` GitHub Release
# assets — the apps fetch them from releases/latest/download/<asset>:
#   - relayers.json       (chain relayer directory)
#   - nostr-relays.json   (Nostr inbox-transport relay directory)
#   - blossom-servers.json (Blossom media-server directory)
#
# Droplet deployment now lives in the onym-infra repo (which runs the
# relayer alongside nostr + blossom on one box). This workflow no longer
# builds an image or touches any server.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Relayer release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELAYERS_JSON: relayers.json
      NOSTR_RELAYS_JSON: nostr-relays.json
      BLOSSOM_SERVERS_JSON: blossom-servers.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: |
          cargo fmt --check
          cargo test

      # Drift tripwire, NOT signature verification (the relayer verifies
      # the signature against the operator key at boot; see
      # operator_manifest::load_and_verify in src/main.rs). This only
      # catches the cheap-to-catch failure mode: someone edits
      # operator-manifest.src.json and forgets to re-run the sign-manifest
      # workflow, so the served (signed) bytes silently keep the OLD
      # terms. Compare canonical content — signature stripped, keys
      # sorted — and fail loudly on mismatch.
      - name: Operator manifest drift check
        run: |
          signed=manifest-signed/manifest.json
          src=operator-manifest.src.json
          if [ ! -f "$signed" ]; then
            echo "No $signed yet (manifest never signed) — skipping drift check."
            exit 0
          fi
          src_norm="$(jq -S 'del(.signature)' "$src")"
          signed_norm="$(jq -S 'del(.signature)' "$signed")"
          if [ "$src_norm" != "$signed_norm" ]; then
            echo "DRIFT: $src no longer matches $signed (canonical content)." >&2
            diff <(printf '%s\n' "$src_norm") <(printf '%s\n' "$signed_norm") >&2 || true
            echo 're-dispatch sign-manifest: the src was edited after the last' >&2
            echo 'signing run, so the served bytes still carry the old terms.' >&2
            exit 1
          fi
          echo "OK: $src matches $signed modulo the signature."

      - name: Validate manifests
        run: |
          scripts/validate-relayers-manifest.py "$RELAYERS_JSON"
          python3 -m json.tool "$RELAYERS_JSON" >/dev/null
          scripts/validate-server-manifest.py --key relays --schemes wss,ws "$NOSTR_RELAYS_JSON"
          python3 -m json.tool "$NOSTR_RELAYS_JSON" >/dev/null
          scripts/validate-server-manifest.py --key servers --schemes https,http "$BLOSSOM_SERVERS_JSON"
          python3 -m json.tool "$BLOSSOM_SERVERS_JSON" >/dev/null

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          BASE="https://github.com/onymchat/onym-relayer/releases/latest/download"
          NOTES="Onym client discovery manifests. Fetch: $BASE/relayers.json · $BASE/nostr-relays.json · $BASE/blossom-servers.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RELAYERS_JSON#relayers.json" \
              "$NOSTR_RELAYS_JSON#nostr-relays.json" \
              "$BLOSSOM_SERVERS_JSON#blossom-servers.json" \
              --clobber
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "$TAG" \
              --notes "$NOTES" \
              "$RELAYERS_JSON#relayers.json" \
              "$NOSTR_RELAYS_JSON#nostr-relays.json" \
              "$BLOSSOM_SERVERS_JSON#blossom-servers.json"
          fi

      - name: Summary
        run: |
          BASE="https://github.com/onymchat/onym-relayer/releases/latest/download"
          {
            echo "### Release"
            echo "- Tag: ${{ inputs.tag }}"
            echo "- relayers.json: $BASE/relayers.json"
            echo "- nostr-relays.json: $BASE/nostr-relays.json"
            echo "- blossom-servers.json: $BASE/blossom-servers.json"
          } >> "$GITHUB_STEP_SUMMARY"
