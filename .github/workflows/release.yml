name: Release

# Publishes relayers.json as the `latest` GitHub Release asset — the
# client discovery manifest the app fetches from
# releases/latest/download/relayers.json.
#
# Droplet deployment now lives in the onym-infra repo (which runs the
# relayer alongside nostr + blossom on one box). This workflow no longer
# builds an image or touches any server.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Relayer release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELAYERS_JSON: relayers.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          cargo fmt --check
          cargo test

      - name: Validate relayers.json
        run: |
          scripts/validate-relayers-manifest.py "$RELAYERS_JSON"
          python3 -m json.tool "$RELAYERS_JSON" >/dev/null

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          NOTES="Onym relayer release. Fetch relayers.json from https://github.com/onymchat/onym-relayer/releases/latest/download/relayers.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELAYERS_JSON#relayers.json" --clobber
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "$TAG" \
              --notes "$NOTES" \
              "$RELAYERS_JSON#relayers.json"
          fi

      - name: Summary
        run: |
          {
            echo "### Release"
            echo "- Tag: ${{ inputs.tag }}"
            echo "- relayers.json: https://github.com/onymchat/onym-relayer/releases/latest/download/relayers.json"
          } >> "$GITHUB_STEP_SUMMARY"
