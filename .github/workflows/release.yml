name: Release

# Publishes the client discovery manifests as `latest` GitHub Release
# assets — the apps fetch them from releases/latest/download/<asset>:
#   - relayers.json       (chain relayer directory)
#   - nostr-relays.json   (Nostr inbox-transport relay directory)
#   - blossom-servers.json (Blossom media-server directory)
#
# Droplet deployment now lives in the onym-infra repo (which runs the
# relayer alongside nostr + blossom on one box). This workflow no longer
# builds an image or touches any server.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Relayer release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELAYERS_JSON: relayers.json
      NOSTR_RELAYS_JSON: nostr-relays.json
      BLOSSOM_SERVERS_JSON: blossom-servers.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          cargo fmt --check
          cargo test

      # Shared with ci.yml so the tripwires cannot diverge; see the
      # script headers. A release is cut by someone who can dispatch
      # sign-manifest, so the expiry check hard-fails here.
      - name: Operator manifest drift check
        run: scripts/check-manifest-drift.sh

      - name: Operator manifest validUntil check
        run: scripts/check-manifest-expiry.sh

      - name: Validate manifests
        run: |
          scripts/validate-relayers-manifest.py "$RELAYERS_JSON"
          python3 -m json.tool "$RELAYERS_JSON" >/dev/null
          scripts/validate-server-manifest.py --key relays --schemes wss,ws "$NOSTR_RELAYS_JSON"
          python3 -m json.tool "$NOSTR_RELAYS_JSON" >/dev/null
          scripts/validate-server-manifest.py --key servers --schemes https,http "$BLOSSOM_SERVERS_JSON"
          python3 -m json.tool "$BLOSSOM_SERVERS_JSON" >/dev/null

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          BASE="https://github.com/onymchat/onym-relayer/releases/latest/download"
          NOTES="Onym client discovery manifests. Fetch: $BASE/relayers.json · $BASE/nostr-relays.json · $BASE/blossom-servers.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RELAYERS_JSON#relayers.json" \
              "$NOSTR_RELAYS_JSON#nostr-relays.json" \
              "$BLOSSOM_SERVERS_JSON#blossom-servers.json" \
              --clobber
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "$TAG" \
              --notes "$NOTES" \
              "$RELAYERS_JSON#relayers.json" \
              "$NOSTR_RELAYS_JSON#nostr-relays.json" \
              "$BLOSSOM_SERVERS_JSON#blossom-servers.json"
          fi

      - name: Summary
        run: |
          BASE="https://github.com/onymchat/onym-relayer/releases/latest/download"
          {
            echo "### Release"
            echo "- Tag: ${{ inputs.tag }}"
            echo "- relayers.json: $BASE/relayers.json"
            echo "- nostr-relays.json: $BASE/nostr-relays.json"
            echo "- blossom-servers.json: $BASE/blossom-servers.json"
          } >> "$GITHUB_STEP_SUMMARY"
