name: Sign operator manifest

# Signs the notary-operator manifest (operator-manifest.src.json) in CI
# with the RELAYER_OPERATOR_SEED secret, commits the signed bytes to
# main under manifest-signed/ (so the bytes the service serves are
# auditable in-repo), redeploys, and verifies that
# https://relayer.onym.app/manifest.json serves EXACTLY the committed
# bytes. Group bindings and entitlements pin the SHA-256 of these bytes
# (onym-system/notary/UI-Notary-BNB.md §8.1), which is why the workflow
# is byte-paranoid end to end.
#
# The signed file reaches the container through the image: the
# Dockerfile copies manifest-signed/ to /srv/operator-manifest/, and
# RELAYER_OPERATOR_MANIFEST points the service at it. Because the image
# is built from the repo, this run MUST be dispatched on main and the
# signed bytes must land ON main — a signed manifest on a side branch
# would never reach a deployed image. The commit step retries the
# direct push a few times for ordinary push races; a ruleset
# rejection (GH013: pull_request required) is deterministic, so it
# falls back immediately to pushing branch signed-manifest/<run_id>
# and opening a PR (closing any stale open signing PR first — newest
# signing wins), and the deploy/byte-verification steps are skipped
# until that PR merges.
#
# Deploy paths:
#   * DigitalOcean App Platform (scripts/deploy-digitalocean.sh
#     conventions: app "onym-relayer", service "relayer", DOCR image
#     onym-relayer:current with deploy_on_push): the default. Requires
#     the org-level DO_API_KEY secret; the workflow sets
#     RELAYER_OPERATOR_MANIFEST in the app spec (waits on that
#     deployment), then pushes a fresh image — deploy_on_push deploys
#     it against the updated spec — and verifies strictly.
#   * onym-infra droplet (docker-compose; the relayer is a git
#     submodule there): run with skip_deploy=true, then bump the
#     relayer submodule in onym-infra, add
#     RELAYER_OPERATOR_MANIFEST=/srv/operator-manifest/manifest.json to
#     relayer.env, and deploy onym-infra. Byte verification then only
#     warns (the droplet has not picked the commit up yet); re-run with
#     skip_deploy=true after the infra deploy for a green byte check.
#
# Secrets:
#   RELAYER_OPERATOR_SEED  64 hex chars (see README "Operator manifest
#                          signing" for generation and custody)
#   DO_API_KEY             org-level DigitalOcean token (only when
#                          deploying via App Platform)
#   SIGNING_PR_TOKEN       OPTIONAL: a PAT or GitHub App token
#                          (contents: write, pull-requests: write).
#                          When set, the PR fallback creates the
#                          signing PR with it, so CI RUNS on that PR.
#                          When absent, the PR is created with the
#                          default GITHUB_TOKEN — such PRs trigger NO
#                          workflows (GitHub's recursion guard), so
#                          they show no checks; verification then
#                          happens in the post-merge push run on main.
#                          If the main ruleset ever gains required
#                          status checks, this secret becomes
#                          effectively mandatory (a checks-less
#                          GITHUB_TOKEN PR could never be merged).
#
# First run vs later runs: the committed src ships with
# operator "onym:key:REPLACE-OPERATOR-KEY"; the first run substitutes
# the key derived from the seed and commits the resolved src alongside
# the signed bytes. Every later run verifies that the committed operator
# key still matches the seed and fails on mismatch (a mismatch means
# the secret changed under a published manifest — that is a different
# operator, not a rotation; see the README).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sign-and-deploy" to confirm signing and publishing the operator manifest'
        required: true
        type: string
      skip_deploy:
        description: 'Sign, commit, and verify only — skip the App Platform redeploy (use this when the relayer is deployed from onym-infra; the byte check then warns instead of failing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # For the PR fallback: gh pr create / gh pr edit with github.token.
  pull-requests: write

# Two runs racing would both sign and race the push to main; serialize.
concurrency:
  group: sign-manifest
  cancel-in-progress: false

env:
  # Exact onymchat/onym-discovery revision the signer CLI is built from.
  # Pinned on purpose: this job holds RELAYER_OPERATOR_SEED, so the
  # signer must be reviewed-and-frozen source, never floating main.
  # Bump deliberately (review the diff in onym-discovery first).
  PINNED_SIGNER_REV: b722c27f459200dd5f0176d96d073b6622ce5cdf
  MANIFEST_SRC: operator-manifest.src.json
  MANIFEST_OUT: manifest-signed/manifest.json
  MANIFEST_URL: https://relayer.onym.app/manifest.json
  MANIFEST_CONTAINER_PATH: /srv/operator-manifest/manifest.json
  APP_NAME: onym-relayer
  SERVICE_NAME: relayer
  IMAGE_REPOSITORY: onym-relayer
  IMAGE_TAG: current

jobs:
  sign:
    runs-on: ubuntu-latest
    # Gate the signing seed behind the "production" environment.
    # CAUTION: GitHub AUTO-CREATES this environment, UNPROTECTED, on the
    # first dispatch — merely naming it here provides no approval gate.
    # The gate exists only after an operator adds required reviewers to
    # the environment in repo Settings, which must happen BEFORE the
    # first dispatch. See README "Operator manifest signing".
    environment: production
    steps:
      - name: Require confirmation and main
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$CONFIRM" != "sign-and-deploy" ]; then
            echo 'Refusing: type "sign-and-deploy" in the confirm input.' >&2
            exit 1
          fi
          if [ "$REF_NAME" != "main" ]; then
            echo "Refusing: dispatched on '$REF_NAME'. The signed manifest must be" >&2
            echo 'committed to main — images are built from main — so this workflow' >&2
            echo 'only runs there. Dispatch it with the main branch selected.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit step recovers from push races with
          # `git pull --rebase`, which needs more than a shallow clone.
          fetch-depth: 0

      # Hard pre-signing gate, deliberately BEFORE anything touches the
      # seed: signing publishes an immutable hash-pinned commitment, so
      # a networks[] entry whose fee-payer does not exist on its
      # network must block the signature, not surface after it. Same
      # script as ci.yml's tripwire (warn-mode there), so the check
      # cannot diverge.
      - name: Fee-payer accounts must exist on their networks
        run: scripts/check-manifest-funding.sh "$MANIFEST_SRC"

      - name: Validate RELAYER_OPERATOR_SEED
        env:
          RELAYER_OPERATOR_SEED: ${{ secrets.RELAYER_OPERATOR_SEED }}
        run: |
          if [ -z "$RELAYER_OPERATOR_SEED" ]; then
            cat >&2 <<'EOF'
          RELAYER_OPERATOR_SEED is not set. Generate the operator seed OFFLINE:

            cargo install --git https://github.com/onymchat/onym-discovery --locked
            onym-discovery keygen --out relayer-operator.seed

          Then:
            - secret value = the file's contents (64 hex characters);
            - keep relayer-operator.seed offline as the custody copy;
            - publish the printed fingerprint out of band;
            - add the secret under repo Settings -> Secrets -> Actions
              (scope it to the "production" environment once that
              environment has required reviewers).

          There is no rotation in v1: a lost or replaced key is a NEW
          operator and clients must re-pin. See README "Operator
          manifest signing".
          EOF
            exit 1
          fi
          seed="$(printf '%s' "$RELAYER_OPERATOR_SEED" | tr -d '[:space:]')"
          if ! printf '%s' "$seed" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo 'RELAYER_OPERATOR_SEED must be exactly 64 hex characters' >&2
            echo '(the whole value, no prefix, whitespace ignored).' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$seed" > "$RUNNER_TEMP/operator.seed"

      # Supply chain: the signer is built FROM SOURCE at the pinned
      # revision, inside this seed-bearing job, every run. Deliberately
      # NO cross-run cache of the compiled binary: Actions caches are
      # writable from any branch of this repo, so a cached executable
      # restored next to RELAYER_OPERATOR_SEED would be a
      # seed-exfiltration path. Caching cargo's registry/git *sources*
      # below is fine — they are checksum-verified against the pinned
      # rev's Cargo.lock at build time.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry (sources only, never binaries)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-src-${{ runner.os }}-signer-${{ env.PINNED_SIGNER_REV }}

      - name: Build onym-discovery CLI from source at pinned rev
        run: |
          cargo install --git https://github.com/onymchat/onym-discovery \
            --rev "$PINNED_SIGNER_REV" --locked --force
          echo "Signer built from onymchat/onym-discovery@$PINNED_SIGNER_REV"

      - name: Derive operator identity
        id: identity
        run: |
          out="$("$HOME/.cargo/bin/onym-discovery" fingerprint --seed "$RUNNER_TEMP/operator.seed")"
          operator="$(printf '%s\n' "$out" | awk '$1 == "operator:" { print $2 }')"
          fingerprint="$(printf '%s\n' "$out" | awk '$1 == "fingerprint:" { print $2 }')"
          case "$operator" in
            onym:key:*) ;;
            *) echo "unexpected fingerprint output: $out" >&2; exit 1 ;;
          esac
          echo "operator=$operator" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Operator id: $operator"
          echo "Fingerprint: $fingerprint"

      - name: Resolve operator key in manifest source
        env:
          OPERATOR: ${{ steps.identity.outputs.operator }}
        run: |
          committed="$(jq -r '.operator' "$MANIFEST_SRC")"
          if [ "$committed" = "onym:key:REPLACE-OPERATOR-KEY" ]; then
            echo "First run: substituting operator key into $MANIFEST_SRC"
            jq --arg op "$OPERATOR" '.operator = $op' "$MANIFEST_SRC" > "$MANIFEST_SRC.tmp"
            mv "$MANIFEST_SRC.tmp" "$MANIFEST_SRC"
          elif [ "$committed" != "$OPERATOR" ]; then
            echo "Operator key mismatch:" >&2
            echo "  committed in $MANIFEST_SRC: $committed" >&2
            echo "  derived from RELAYER_OPERATOR_SEED: $OPERATOR" >&2
            echo 'The secret does not correspond to the published operator.' >&2
            echo 'A key change is a NEW operator (clients re-pin), never an' >&2
            echo 'edit — fix the secret, or knowingly update the src first.' >&2
            exit 1
          fi

      - name: Sign manifest
        run: |
          mkdir -p "$(dirname "$MANIFEST_OUT")"
          "$HOME/.cargo/bin/onym-discovery" sign-manifest \
            --seed "$RUNNER_TEMP/operator.seed" \
            "$MANIFEST_SRC" --out "$MANIFEST_OUT"
          sha256sum "$MANIFEST_OUT"

      # Validate the signer's output in the job that produced it, BEFORE
      # anything is committed or deployed — with the relayer's own
      # boot-path verifier (operator_manifest::verify_file), i.e. the
      # exact code that will accept or refuse these bytes in production.
      # It also checks the detached .sig agrees with the embedded
      # signature. Deliberately NOT the pinned onym-discovery CLI: its
      # `verify manifest` enforces the *discovery provider* schema
      # (seat "discovery") and rejects this notary-seat manifest.
      - name: Verify signed manifest with the boot-path verifier
        run: |
          cargo run --quiet -- verify-operator-manifest \
            "$MANIFEST_OUT" "$MANIFEST_OUT.sig"

      # Expiry gate on the OUTPUT, before it is committed: signing a
      # src whose validUntil is already inside the 30-day warning
      # window would sign cleanly here and then trip CI's expiry
      # tripwire immediately (or worse, lapse before anyone re-signs).
      # Same shared script as ci.yml, hard-fail mode.
      - name: Freshly signed manifest must not be near expiry
        run: scripts/check-manifest-expiry.sh "$MANIFEST_OUT"

      - name: Commit signed bytes to main
        id: commit
        env:
          # SIGNING_PR_TOKEN (optional PAT/App token) makes CI run on
          # the fallback PR; with the default github.token, GitHub's
          # recursion guard means the PR triggers no workflows at all.
          GH_TOKEN: ${{ secrets.SIGNING_PR_TOKEN || github.token }}
          PR_TOKEN_MODE: ${{ secrets.SIGNING_PR_TOKEN != '' && 'signing-pr-token' || 'github-token' }}
          OPERATOR: ${{ steps.identity.outputs.operator }}
          FINGERPRINT: ${{ steps.identity.outputs.fingerprint }}
        run: |
          rm -f "$RUNNER_TEMP/operator.seed"
          # The pinned signer writes a detached "$MANIFEST_OUT.sig"
          # sibling (verified against PINNED_SIGNER_REV: sign-manifest
          # in onym-discovery src/main.rs writes sig_path(&out)), but
          # stage the output directory tolerantly anyway: naming the
          # .sig explicitly would hard-fail the run POST-signing if a
          # future pinned rev's output set differs, with the signed
          # bytes already produced.
          git add -A -- "$MANIFEST_SRC" manifest-signed/
          if git diff --cached --quiet; then
            echo 'Signed bytes are unchanged — nothing to commit.'
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Sign the notary-operator manifest' \
            -m 'Signed in CI by the sign-manifest workflow. manifest-signed/manifest.json
          is served byte-for-byte at GET /manifest.json; bindings pin its SHA-256.' \
            -m "Signer: onymchat/onym-discovery@$PINNED_SIGNER_REV (built from source at this pinned rev)"
          # Direct push, up to 3 attempts — but only failures that can
          # heal are retried: a push race (someone landed on main
          # between our rebase and push) is fixed by the next
          # rebase+push, while a ruleset rejection (GH013,
          # pull_request required) is deterministic and retrying it is
          # futile — that goes straight to the PR fallback. Parse the
          # push stderr to tell the two shapes apart.
          mode=""
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "git pull --rebase failed (attempt $attempt of 3)." >&2
              [ "$attempt" -lt 3 ] && { sleep 5; continue; }
              break
            fi
            if push_out="$(git push origin HEAD:main 2>&1)"; then
              printf '%s\n' "$push_out"
              mode=direct
              break
            fi
            printf '%s\n' "$push_out" >&2
            if printf '%s' "$push_out" \
                | grep -Eqi 'GH013|repository rule violations|protected branch'; then
              echo 'Protected-branch rejection (GH013) — deterministic under the' >&2
              echo 'main ruleset, retrying is futile. Falling back to a PR.' >&2
              break
            fi
            echo "Push attempt $attempt of 3 failed for a non-ruleset reason" >&2
            echo '(likely a concurrent-push race); retrying after a rebase.' >&2
            [ "$attempt" -lt 3 ] && sleep 5
          done
          if [ "$mode" = "direct" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="signed-manifest/${GITHUB_RUN_ID}"
          # If even the branch push fails (a ruleset targeting
          # signed-manifest/*, token permissions, outage), do not die
          # bare: the signed bytes would be stranded in the ephemeral
          # runner. Preserve the signing commit as a patch in the step
          # summary so an operator can `git am` it locally.
          if ! git push origin "HEAD:refs/heads/$branch"; then
            {
              echo '## Signing-branch push failed — commit preserved as a patch'
              echo
              echo "Pushing \`$branch\` was rejected. Check for a ruleset that"
              echo 'also targets `signed-manifest/*` branches, for the'
              echo "workflow token's contents:write permission, or a transient"
              echo 'GitHub outage. The signing commit is recoverable: save the'
              echo 'patch below, apply it locally with `git am`, push a branch,'
              echo 'and open a PR to main.'
              echo
              echo '```'
              git format-patch -1 --stdout
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: could not push $branch. If a ruleset also targets" >&2
            echo 'signed-manifest/* branches, exempt this workflow or those' >&2
            echo 'refs. The signing commit is preserved as a git format-patch' >&2
            echo 'in the step summary — recover it with `git am`.' >&2
            exit 1
          fi
          # Newest signing wins: an open PR from an earlier signing run
          # carries stale bytes, and merging it after this run would
          # publish an older manifest. Close it and delete its branch,
          # loudly, before opening the fresh PR.
          stale="$(gh pr list --state open --json number,url,headRefName \
            --jq '.[] | select(.headRefName | startswith("signed-manifest/"))
                  | [(.number | tostring), .url, .headRefName] | @tsv')"
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale" | while IFS=$'\t' read -r num url head; do
              [ "$head" = "$branch" ] && continue
              echo "Closing stale signing PR #$num ($url) and deleting branch $head — newest signing wins."
              gh pr close "$num" --delete-branch \
                --comment "Superseded by a newer signing run (run ${GITHUB_RUN_ID} opens a fresh signing PR — newest signing wins). Closing this PR and deleting \`$head\`." \
                || echo "::warning::Could not close stale signing PR #$num ($url). Close it manually — merging it now would publish stale bytes."
            done
          fi
          valid_until="$(jq -r '.validUntil // "<missing>"' "$MANIFEST_OUT")"
          {
            echo 'Signed in CI by the sign-manifest workflow. The main ruleset'
            echo 'rejected the direct push (GH013: pull_request required), so the'
            echo 'signing commit arrives via this PR instead. Merging it is the'
            echo 'human step that lands the signed bytes on main — squash merge'
            echo '(the ruleset requires linear history and allows squash only).'
            echo
            echo "- **Signer**: \`onymchat/onym-discovery@$PINNED_SIGNER_REV\` (built from source at the pinned rev)"
            echo "- **Operator id**: \`${OPERATOR:-<not derived>}\`"
            echo "- **Operator fingerprint**: \`${FINGERPRINT:-<not derived>}\`"
            echo "- **validUntil**: \`$valid_until\`"
            echo
            if [ "$PR_TOKEN_MODE" = "signing-pr-token" ]; then
              echo 'Created with the `SIGNING_PR_TOKEN` secret, so CI runs on'
              echo 'this PR: `verify-operator-manifest` (the boot-path verifier)'
              echo 'checks the manifest/signature pair — warn-mode here,'
              echo 'hard-fail on main once merged.'
            else
              echo '**This PR carries no CI runs** (GITHUB_TOKEN recursion'
              echo "guard: PRs created with the workflow's own token never"
              echo 'trigger workflows). Verification happens in the post-merge'
              echo 'push run on main, where `verify-operator-manifest` (the'
              echo 'boot-path verifier) hard-fails on a bad pair.'
            fi
            echo
            echo 'After merging, per deploy path:'
            echo '- **App Platform** (default): re-dispatch sign-manifest'
            echo '  WITHOUT `skip_deploy` — signing is idempotent on unchanged'
            echo '  src (nothing to commit), so the deploy and the strict'
            echo '  served-byte verification run.'
            echo '- **onym-infra droplet**: bump the relayer submodule, set'
            echo '  `RELAYER_OPERATOR_MANIFEST` in relayer.env, deploy'
            echo '  onym-infra, then re-dispatch WITH `skip_deploy=true` for'
            echo '  the served-byte check.'
          } > "$RUNNER_TEMP/pr-body.md"
          if ! pr_url="$(gh pr create --base main --head "$branch" \
            --title "Publish signed operator manifest ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/pr-body.md" 2>"$RUNNER_TEMP/pr-create.err")"; then
            cat "$RUNNER_TEMP/pr-create.err" >&2
            if grep -Eqi 'not permitted|HTTP 403|Resource not accessible' "$RUNNER_TEMP/pr-create.err"; then
              echo 'gh pr create was refused (403). With the default GITHUB_TOKEN' >&2
              echo 'this requires the setting "Allow GitHub Actions to create and' >&2
              echo 'approve pull requests" to be enabled under Settings -> Actions' >&2
              echo '-> General — at BOTH the org and the repo level (the org' >&2
              echo 'setting caps the repo one). Enable it, or set the' >&2
              echo 'SIGNING_PR_TOKEN secret (PAT/App token) instead.' >&2
            fi
            echo "The signing commit is safe on branch $branch — open the PR" >&2
            echo 'manually from that branch after fixing the cause above.' >&2
            exit 1
          fi
          # Label only when the repo already has a matching label —
          # minting labels is not this workflow's business, and a
          # missing label must not fail the run post-signing.
          for lbl in signed-manifest automated; do
            if gh label list --limit 100 --json name --jq '.[].name' | grep -Fxq "$lbl"; then
              gh pr edit "$pr_url" --add-label "$lbl" || true
            fi
          done
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "mode=pr" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "token_mode=$PR_TOKEN_MODE" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url — squash-merge it to land the signed bytes on main."

      # PR-fallback mode: the signed bytes are NOT on main yet, so
      # deploying or byte-checking now would deploy/verify a stale
      # manifest. Every deploy/verify step below is gated on
      # mode != 'pr'; this step says so loudly instead of leaving a
      # trail of silently skipped steps.
      - name: Signed bytes await PR merge (deploy/verify skipped)
        if: ${{ steps.commit.outputs.mode == 'pr' }}
        env:
          PR_URL: ${{ steps.commit.outputs.pr_url }}
          TOKEN_MODE: ${{ steps.commit.outputs.token_mode }}
        run: |
          echo "::notice::Signed bytes await PR merge: $PR_URL — deploy and byte verification are skipped in this run."
          if [ "$TOKEN_MODE" != "signing-pr-token" ]; then
            echo "::notice::That PR carries no CI runs (GITHUB_TOKEN recursion guard); verification happens in the post-merge push run on main."
          fi
          echo 'The bytes are not on main yet, so this run stops before the'
          echo 'deploy/byte-verification steps. Squash-merge the PR (the main'
          echo 'ruleset requires linear history and allows squash only); main'
          echo 'then carries the signed bytes. Then, per deploy path:'
          echo '  * App Platform (default): re-dispatch this workflow WITHOUT'
          echo '    skip_deploy — signing is idempotent on unchanged src, so it'
          echo '    finds nothing to commit (mode=none) and the deploy plus the'
          echo '    strict served-byte verification run.'
          echo '  * onym-infra droplet: bump the relayer submodule, set'
          echo '    RELAYER_OPERATOR_MANIFEST in relayer.env, deploy onym-infra,'
          echo '    then re-dispatch WITH skip_deploy=true for the served-byte'
          echo '    check (nothing to commit; the check is the point).'

      # Checked in its own step BEFORE digitalocean/action-doctl: with
      # an empty token that action dies with an opaque auth error, and
      # the operator never sees the skip_deploy hint.
      - name: Require DO_API_KEY
        if: ${{ !inputs.skip_deploy && steps.commit.outputs.mode != 'pr' }}
        env:
          DO_API_KEY: ${{ secrets.DO_API_KEY }}
        run: |
          if [ -z "$DO_API_KEY" ]; then
            echo 'DO_API_KEY is not set (org-level DigitalOcean token).' >&2
            echo 'Either add it, or run with skip_deploy=true and deploy' >&2
            echo 'from onym-infra instead.' >&2
            exit 1
          fi

      - name: Install doctl
        if: ${{ !inputs.skip_deploy && steps.commit.outputs.mode != 'pr' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_KEY }}

      # Ordering: the spec update runs BEFORE the image push. Pushing
      # the :current tag already triggers a deployment on its own
      # (deploy_on_push), so updating the spec afterwards used to mint
      # a SECOND deployment racing the first (and --update-sources
      # forced yet another source pull) — with --wait attached to
      # whichever the update happened to create while deploy_on_push
      # superseded it. Spec first means --wait attaches to the spec
      # deployment, and the single push afterwards triggers exactly one
      # image deployment that App Platform sequences after it; the
      # byte-verification step's retry loop absorbs its rollout.
      - name: Set RELAYER_OPERATOR_MANIFEST in the app spec
        if: ${{ !inputs.skip_deploy && steps.commit.outputs.mode != 'pr' }}
        id: spec
        run: |
          app_id="$(doctl apps list --format ID,Spec.Name --no-header \
            | awk -v name="$APP_NAME" '$2 == name { print $1; exit }')"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          if [ -z "$app_id" ]; then
            echo "No App Platform app named '$APP_NAME'." >&2
            echo 'If this relayer is deployed from onym-infra (docker-compose' >&2
            echo 'droplet), run this workflow with skip_deploy=true, bump the' >&2
            echo 'relayer submodule in onym-infra, set' >&2
            echo "RELAYER_OPERATOR_MANIFEST=$MANIFEST_CONTAINER_PATH in" >&2
            echo 'relayer.env, and deploy onym-infra.' >&2
            exit 1
          fi
          doctl apps get "$app_id" --output json | jq '.[0].spec' > "$RUNNER_TEMP/spec.json"
          # The env upsert below selects by service name; if the name did
          # not match it would be a SILENT no-op and the app would deploy
          # without RELAYER_OPERATOR_MANIFEST. Assert the service exists.
          if ! jq -e --arg svc "$SERVICE_NAME" \
              '.services[]? | select(.name == $svc)' \
              "$RUNNER_TEMP/spec.json" > /dev/null; then
            echo "No service named '$SERVICE_NAME' in the app spec of '$APP_NAME'." >&2
            echo 'Services present:' >&2
            jq -r '[.services[]?.name] | join(", ")' "$RUNNER_TEMP/spec.json" >&2
            echo 'Fix SERVICE_NAME in this workflow (or the app spec) —' >&2
            echo 'otherwise the env upsert silently does nothing.' >&2
            exit 1
          fi
          jq --arg svc "$SERVICE_NAME" --arg path "$MANIFEST_CONTAINER_PATH" '
            (.services[] | select(.name == $svc) | .envs) |=
              ((. // []) | map(select(.key != "RELAYER_OPERATOR_MANIFEST")) + [{
                key: "RELAYER_OPERATOR_MANIFEST",
                value: $path,
                scope: "RUN_TIME",
                type: "GENERAL"
              }])
          ' "$RUNNER_TEMP/spec.json" > "$RUNNER_TEMP/spec.new.json"
          # No --update-sources: this deployment exists to apply the env
          # var; the fresh image arrives via the deploy_on_push
          # deployment that the next step's push triggers. On the FIRST
          # signing run this spec deployment can fail — it restarts the
          # currently-pinned PRE-signing image with
          # RELAYER_OPERATOR_MANIFEST set, and the relayer refuses to
          # boot when the file is missing. The spec is stored
          # regardless, and the image push right after converges the
          # app (signed image + stored spec), so warn and continue; the
          # byte verification below is the real gate.
          if ! doctl apps update "$app_id" \
            --spec "$RUNNER_TEMP/spec.new.json" \
            --format ID,DefaultIngress,Updated \
            --no-header \
            --wait; then
            echo '::warning::Spec deployment failed — expected on the first' \
              'signing run (the previously pinned image predates' \
              'manifest-signed/). The image push next converges the app;' \
              'the byte verification step decides pass/fail.'
          fi

      - name: Build and push image to DOCR
        if: ${{ !inputs.skip_deploy && steps.commit.outputs.mode != 'pr' }}
        run: |
          registry="$(doctl registry get --format Name --no-header)"
          if [ -z "$registry" ]; then
            echo 'no DigitalOcean Container Registry found; deploy has never' >&2
            echo 'run — run scripts/deploy-digitalocean.sh once first.' >&2
            exit 1
          fi
          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/$registry/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker build --pull --platform linux/amd64 -t "$image" .
          docker push "$image"
          echo "Pushed $image (deploy_on_push deploys it against the updated spec)."

      # Wait for the push-triggered (deploy_on_push) deployment to
      # reach ACTIVE before checking bytes: the byte loop should spend
      # its budget on routing/cache convergence, not on the whole
      # build+rollout, and a deployment that ERRORs should say so
      # instead of surfacing as a mysterious byte mismatch.
      - name: Wait for the image deployment to go ACTIVE
        if: ${{ !inputs.skip_deploy && steps.commit.outputs.mode != 'pr' }}
        env:
          APP_ID: ${{ steps.spec.outputs.app_id }}
        run: |
          # ~10 minutes; the deploy_on_push deployment can also take a
          # moment to APPEAR after the push, which the same loop absorbs.
          for _ in $(seq 1 60); do
            phase="$(doctl apps list-deployments "$APP_ID" \
              --format Phase --no-header | head -n1 || true)"
            echo "Latest deployment phase: ${phase:-<none>}"
            case "$phase" in
              ACTIVE)
                exit 0
                ;;
              ERROR|CANCELED)
                echo "FAIL: latest deployment ended in $phase — the signed" >&2
                echo 'bytes ARE committed and pushed; fix the deployment and' >&2
                echo 're-run this workflow with skip_deploy=true to verify.' >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo '::warning::Deployment did not reach ACTIVE within the wait' \
            'budget; proceeding to byte verification, which decides pass/fail.'

      # Skipped in PR-fallback mode: the served endpoint cannot match
      # bytes that are not on main (or in any image) yet, so a byte
      # check now would only produce a misleading mismatch.
      - name: Verify served bytes
        if: ${{ steps.commit.outputs.mode != 'pr' }}
        env:
          SKIP_DEPLOY: ${{ inputs.skip_deploy }}
        run: |
          want="$(sha256sum "$MANIFEST_OUT" | cut -d' ' -f1)"
          echo "Committed sha256: $want"
          fetch_sha() {
            curl -fsS "$MANIFEST_URL" -o "$RUNNER_TEMP/fetched.json" \
              && sha256sum "$RUNNER_TEMP/fetched.json" | cut -d' ' -f1
          }
          got1=""
          # The deployment is ACTIVE by now (previous step), so this
          # budget only has to cover routing/edge-cache convergence —
          # but generously: a false FAIL here is alarming and the run
          # cannot be partially retried (the commit already happened).
          # With skip_deploy nothing was redeployed, so a mismatch will
          # not heal itself — keep that retry budget short.
          attempts=60
          if [ "$SKIP_DEPLOY" = "true" ]; then
            attempts=3
          fi
          for i in $(seq 1 "$attempts"); do
            got1="$(fetch_sha || true)"
            [ "$got1" = "$want" ] && break
            # No pointless sleep after the final attempt.
            [ "$i" -lt "$attempts" ] && sleep 10
          done
          got2="$(fetch_sha || true)"
          echo "Fetched sha256 (1st): ${got1:-<fetch failed>}"
          echo "Fetched sha256 (2nd): ${got2:-<fetch failed>}"
          if [ "$got1" = "$want" ] && [ "$got2" = "$want" ]; then
            echo "OK: $MANIFEST_URL serves the committed bytes, stably."
            exit 0
          fi
          if [ "$SKIP_DEPLOY" = "true" ]; then
            echo "::warning::$MANIFEST_URL does not (yet) serve the committed bytes." \
              'Expected while the onym-infra deployment has not picked up this' \
              'commit — bump the relayer submodule, set RELAYER_OPERATOR_MANIFEST' \
              'in relayer.env, deploy, then re-run with skip_deploy=true.'
            exit 0
          fi
          # Two distinct failure shapes, distinct messages — the signed
          # bytes are committed and pushed either way, so neither means
          # the signing itself must be redone.
          if [ -n "$got1" ] && [ "$got1" = "$got2" ]; then
            echo "FAIL: served bytes differ from the committed manifest (stable" >&2
            echo "mismatch: served $got1, committed $want). Bindings pin the" >&2
            echo 'SHA-256 of the committed bytes; a divergent serving path breaks' >&2
            echo 'every client that pinned them. Find what is serving the old' >&2
            echo 'bytes (stale deployment? other deploy path?) before anything pins.' >&2
            exit 1
          fi
          echo 'FAIL: bytes committed and pushed — verification TIMED OUT,' >&2
          echo 'NOT necessarily divergence: the endpoint never settled on a' >&2
          echo 'stable answer within the retry budget (slow rollout, transient' >&2
          echo '5xx, cache churn). Re-run verification without re-signing:' >&2
          echo 'dispatch this workflow again with skip_deploy=true (signing is' >&2
          echo 'idempotent on unchanged src — it will find nothing to commit' >&2
          echo 'and just check the served bytes).' >&2
          exit 1

      # Belt and braces: the commit step already deletes the seed on the
      # happy path, but any earlier failure would leave it on disk for
      # the rest of the job. Runners are ephemeral, caches are not — and
      # later steps/actions should never have seed material readable.
      - name: Remove seed material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/operator.seed"
          find "$GITHUB_WORKSPACE" -type f -name '*.seed' -print -delete || true

      - name: Job summary
        if: always()
        env:
          OPERATOR: ${{ steps.identity.outputs.operator }}
          FINGERPRINT: ${{ steps.identity.outputs.fingerprint }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          PR_URL: ${{ steps.commit.outputs.pr_url }}
          TOKEN_MODE: ${{ steps.commit.outputs.token_mode }}
        run: |
          digest=""
          if [ -f "$MANIFEST_OUT" ]; then
            digest="$(sha256sum "$MANIFEST_OUT" | cut -d' ' -f1)"
          fi
          {
            echo '## Notary operator identity'
            echo
            echo 'Publish these OUT OF BAND (site, repo README, announcement) so'
            echo 'clients can check what they pin:'
            echo
            echo "- **Operator id**: \`${OPERATOR:-<not derived>}\`"
            echo "- **Fingerprint**: \`${FINGERPRINT:-<not derived>}\`"
            echo "- **Manifest sha256**: \`${digest:-<not signed>}\`"
            echo "- **Signer**: \`onymchat/onym-discovery@$PINNED_SIGNER_REV\` (built from source)"
            echo "- New signing commit pushed: ${COMMITTED:-false}"
            if [ -n "$PR_URL" ]; then
              echo "- **Signing PR (awaiting merge)**: $PR_URL"
              echo
              echo 'The main ruleset rejected the direct push, so the signed bytes'
              echo 'travel via the PR above. Squash-merge it to land them on main;'
              echo 'deploy and served-byte verification were skipped in this run.'
              if [ "$TOKEN_MODE" != "signing-pr-token" ]; then
                echo 'The PR carries no CI runs (GITHUB_TOKEN recursion guard);'
                echo 'verification happens in the post-merge push run on main.'
              fi
            fi
            echo
            echo 'The Discovery catalog pins this operator id: replace'
            echo '`onym:key:REPLACE-RELAYER-KEY` in onym-discovery'
            echo '`deploy/onym/catalogs/onym-services.config.json` with the'
            echo 'operator id above.'
          } >> "$GITHUB_STEP_SUMMARY"
