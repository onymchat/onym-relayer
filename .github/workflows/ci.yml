name: CI

# Runs on every PR and on pushes to main. Besides fmt + tests, this
# runs the two operator-manifest tripwires (scripts/check-manifest-*.sh,
# shared with release.yml so the checks cannot diverge):
#
#   * drift check: operator-manifest.src.json edited without re-running
#     the sign-manifest workflow means the served (signed) bytes
#     silently keep the OLD terms;
#   * validUntil check: an expiring signed manifest must be re-signed
#     BEFORE expiry — clients reject expired manifests, so letting
#     validUntil lapse breaks every pinned client at once. On PRs this
#     only warns: expiry is a state of main that a PR author cannot
#     fix, so it must not gate unrelated PRs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      # Shared with release.yml; see the script headers for what each
      # tripwire catches (and what it deliberately does not).
      - name: Operator manifest drift check
        run: scripts/check-manifest-drift.sh

      # Warn-only on PRs (an expiring manifest is fixed by dispatching
      # sign-manifest on main, not by any PR); hard fail on push to
      # main, where the people who can act see it.
      - name: Operator manifest validUntil check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-manifest-expiry.sh --warn
          else
            scripts/check-manifest-expiry.sh
          fi
