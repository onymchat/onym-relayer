name: CI

# Runs on every PR and on pushes to main. Besides fmt + tests, this
# runs the operator-manifest tripwires (scripts/check-manifest-*.sh,
# shared with release.yml and sign-manifest.yml so the checks cannot
# diverge):
#
#   * drift check: operator-manifest.src.json edited without re-running
#     the sign-manifest workflow means the served (signed) bytes
#     silently keep the OLD terms;
#   * validUntil check: an expiring signed manifest must be re-signed
#     BEFORE expiry — clients reject expired manifests, so letting
#     validUntil lapse breaks every pinned client at once;
#   * funding check: every networks[] submitterAccount must exist on
#     its network's Horizon — a nonexistent fee-payer means every
#     relayed transaction there fails while the pinned manifest keeps
#     promising it works. Accounts are funded (and can be emptied)
#     independently of any PR, which is why this also runs on push.
#
# All three warn (::warning::) instead of failing on pull_request: each
# flags a state of main that the PR author cannot fix from the PR —
# expiry and funding are fixed by dispatching sign-manifest / funding
# the account, and drift is red BY DESIGN on the very PR that remedies
# it (sign-manifest re-aligns the signed bytes only after merge). Push
# to main hard-fails, where the people who can act see it. The mode
# plumbing lives once in scripts/manifest-check-lib.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      # Once the manifest has been signed, run the signed bytes through
      # the relayer's own boot-path verifier (the exact code that
      # accepts or refuses them in production) so a bad signed artifact
      # is red on every PR and push, not only at the next deploy.
      - name: Verify signed manifest with the boot-path verifier
        run: |
          if [ -f manifest-signed/manifest.json ]; then
            cargo run -q -- verify-operator-manifest \
              manifest-signed/manifest.json manifest-signed/manifest.json.sig
          else
            echo 'No manifest-signed/manifest.json yet — skipping.'
          fi

      # The tripwires (shared scripts; see each header for what it
      # catches and what it deliberately does not). Warn-only on PRs,
      # hard fail on push to main — see the workflow header comment.
      - name: Tripwire mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "flag=--warn" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Operator manifest drift check
        run: scripts/check-manifest-drift.sh ${{ steps.mode.outputs.flag }}

      - name: Operator manifest validUntil check
        run: scripts/check-manifest-expiry.sh ${{ steps.mode.outputs.flag }}

      - name: Operator manifest funding check
        run: scripts/check-manifest-funding.sh ${{ steps.mode.outputs.flag }}
